name: Deploy Node API to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user/buy-bulk-api

            echo "Pulling latest code..."
            git pull origin master

            echo "Building docker image..."
            docker build -t buy-bulk-api .

            echo "Stopping old container..."
            docker stop buy-bulk-api-container || true
            docker rm buy-bulk-api-container || true

            echo "Starting new container..."
            docker run -d \
              --name buy-bulk-api-container \
              --env-file .env \
              -p 3000:3000 \
              buy-bulk-api
