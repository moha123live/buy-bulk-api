name: Deploy Node API to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/buy-bulk-api
            git pull origin master
            docker build -t buy-bulk-api .
            docker stop buy-bulk-api-container || true
            docker rm buy-bulk-api-container || true
            docker run -d \
              --name buy-bulk-api-container \
              --env-file .env \
              -p 3000:3000 \
              buy-bulk-api
